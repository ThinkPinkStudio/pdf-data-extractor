name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Pipeline minima: solo il bump di versione a ogni push su main.
# Il deploy della web app lo fa Coolify (build automatica del Dockerfile web/);
# con l'app desktop eliminata non c'e' piu' nessun artefatto Electron da
# compilare/pubblicare. Il bump serve a NEXT_PUBLIC_APP_VERSION (web) e a
# tracciare cosa e' arrivato in produzione.
jobs:
  bump:
    # Salta i commit di bump (non dovrebbero comunque triggerare nulla, dato
    # che sono pushati col GITHUB_TOKEN, ma teniamo la guardia per sicurezza).
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          NEW=$(node -e "
            const [major, minor, patch] = '$CURRENT'.split('.').map(Number);
            console.log(major + '.' + minor + '.' + (patch + 1));
          ")
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n', 'utf8');
          "
          git add package.json
          git commit -m "chore: bump version to $NEW"
          git push
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"