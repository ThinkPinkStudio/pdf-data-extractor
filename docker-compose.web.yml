services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"   # Web app
      - "3001:3001"   # MCP server (proteggere con firewall/Nginx per IP)
    volumes:
      - ./data:/app/data   # Log NIS2 + upload temporanei
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       pdf_extractor
      POSTGRES_USER:     appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d pdf_extractor"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
