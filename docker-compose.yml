version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - web/.env
    volumes:
      - pdf_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pdf_data:
    driver: local
